# goals.example.yaml — copy to goals.yaml (gitignored) and edit:
#     cp goals.example.yaml goals.yaml
#
# goals.yaml holds ONLY your INTENT (research goals, triage criteria, rubric,
# summary structure, language) plus the unavoidable LLM CONNECTION. Every
# technical knob (model token budgets, thresholds, classifier params, prompts,
# prestige/quality-review/corpus settings) is a VALIDATED CODE DEFAULT — it is not
# configured here. To override one, set its `ZS_*` env var (see docs/overrides.md)
# or, normally, just let the app calibrate it to your setup. The Settings UI / the
# first-run wizard write this same file for you; hand-editing is the fallback.

# --- Your research intent ----------------------------------------------------
research_goals:
- Replace with your first research focus area
- Replace with your second research focus area
- Replace with your third research focus area

triage_criteria:
- Relevance to your stated research goals above.
- Presence of a robust evaluation protocol (external validation, ablation, CIs).
- Clear methodology details (dataset provenance, preprocessing, training setup).

# 1–5 relevance rubric (required; all five keys must be present).
relevance_scale:
  1: Tangential topic, weak methods, low practical utility for current goals.
  2: Some overlap with goals but limited methodological rigor or novelty.
  3: Moderately relevant, useful signals, but incomplete evidence for adoption.
  4: Highly relevant with strong methods and likely near-term impact.
  5: Critical relevance, excellent rigor, immediate applicability.

# Optional reading-priority labels (leave empty {} to use the built-in scale).
reading_priority_scale: {}

# Sections the paper brief is organised into.
summary_structure:
- Executive Summary
- Should I Deep Read This?
- Key Sections to Read
- Relevance to My Research
- Key Findings
- Methods
- Limitations

output_language: English

# --- LLM connection ----------------------------------------------------------
# The endpoint + model that scores your feed and writes deep reviews. `api_key_env`
# is the NAME of the env var holding the key (set it in .env), never the key itself.
# Use ${OPENAI_API_BASE} to read the base URL from the environment.
llm:
  draft_model: gpt-oss:20b
  refine_model: gpt-oss:20b
  api_base: ${OPENAI_API_BASE}
  api_key_env: OPENAI_API_KEY

# Optional: route individual stages at different providers/models (e.g. a cheap
# local model for the high-volume feed, a stronger one for deep_review). Omit to
# use the single `llm:` connection above for every stage. The Settings "AI models"
# editor and the first-run wizard manage this block for you.
# llm_routing:
#   providers:
#     - name: local
#       type: openai            # any OpenAI-compatible endpoint (Ollama/vLLM/MLX/…)
#       base_url: ${OPENAI_API_BASE}
#       api_key_env: OPENAI_API_KEY
#   default: {provider: local, model: gpt-oss:20b}
#   deep_review: {}             # inherits default unless you set provider/model

# --- Institutional access (optional) -----------------------------------------
# Only present when you turn it on (Settings → University access). Lets the review
# fleet fetch paywalled/non-arXiv PDFs via your institutional browser session.
# university_access:
#   enabled: true
#   login_url: https://your-library.example.edu/login
