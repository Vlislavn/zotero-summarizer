# Project guardrails; run explicitly via `make lint` (see CONTRIBUTING.md).
# Commit-hook installation is optional; no automatic stashing is required.
repos:
  - repo: local
    hooks:
      - id: file-loc-limit
        name: hard file LOC <= 500 (no exceptions)
        entry: python3 tools/precommit/check_file_loc.py
        language: system
        types: [python]

      - id: import-structure-policy
        name: layered-import + services-structure policy
        entry: python3 tools/precommit/check_import_policy.py
        language: system
        types: [python]

      - id: module-readme
        name: every package has a README, refreshed when its code changes
        entry: python3 tools/precommit/check_module_readme.py
        language: system
        pass_filenames: false
        always_run: true

      # deadcode-audit tracks main (no pin; `make deadcode-update` refreshes it). Its diff gates
      # see only committed changes vs the base, so they run at pre-push and in `make lint`.
      - id: deadcode-gates
        name: deadcode-audit (orphans, vulture, redundancy; committed diff vs base)
        entry: bash -c 'b="${DEADCODE_BASE:-origin/main}"; d=.venv/bin/deadcode; $d runtime-consumer-check --compare-branch "$b" && $d vulture-changed --compare-branch "$b" && $d redundancy --compare-branch "$b"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: slop-check
        name: debug leftovers + code-in-head complexity blocked
        entry: python3 tools/precommit/check_slop.py slop-check
        language: system
        types: [python]

      - id: slop-sweep
        name: AI-slop sweep (advisory)
        entry: python3 tools/precommit/check_slop.py slop-sweep
        language: system
        pass_filenames: false
        always_run: true
